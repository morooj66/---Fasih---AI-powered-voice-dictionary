<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>فصيح - مساعد المعاني</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>فصيح</h1>
      <p class="subtitle">قل: فصيح ثم اسأل عن معنى الكلمة أو جذرها أو مرادفها.</p>
    </header>

    <main class="container">
      <section class="card">
        <h2 class="card-title">التحكم</h2>

        <div class="controls">
          <button id="recordBtn" class="btn btn-primary" aria-pressed="false" type="button">
            ابدأ التسجيل
          </button>

          <button id="sendBtn" class="btn btn-secondary" type="button" disabled>
            إرسال
          </button>
        </div>

        <div class="file-row">
          <label class="file-label" for="audioInput">أو اختر ملف صوت</label>
          <input id="audioInput" type="file" accept="audio/*" />
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </section>

      <section class="card">
        <h2 class="card-title">النتيجة</h2>

        <div class="result-row">
          <div class="result-label">النص:</div>
          <div id="transcript" class="result-value">-</div>
        </div>

        <div class="result-row">
          <div class="result-label">الرد:</div>
          <div id="responseText" class="result-value">-</div>
        </div>

        <audio id="audioPlayer" class="audio" controls preload="none"></audio>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
